<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeOverlap</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="h1">TimeOverlap</h1>
        <button id="add-member-btn" class="btn header-btn" aria-label="Add Team Member">+</button>
    </header>

    <main class="main">
        <div class="grid-wrapper">
            <section class="grid" role="table" aria-label="Team Schedule">
                <div class="header-row grid-header" role="row">
                    <p role="columnheader">Name</p>
                    <p role="columnheader">Location</p>
                    <p role="columnheader">12am</p><p role="columnheader">1am</p>
                    <p role="columnheader">2am</p><p role="columnheader">3am</p>
                    <p role="columnheader">4am</p><p role="columnheader">5am</p>
                    <p role="columnheader">6am</p><p role="columnheader">7am</p>
                    <p role="columnheader">8am</p><p role="columnheader">9am</p>
                    <p role="columnheader">10am</p> <p role="columnheader">11am</p>
                    <p role="columnheader">12pm</p><p role="columnheader">1pm</p>
                    <p role="columnheader">2pm</p><p role="columnheader">3pm</p>
                    <p role="columnheader">4pm</p><p role="columnheader">5pm</p>
                    <p role="columnheader">6pm</p><p role="columnheader">7pm</p>
                    <p role="columnheader">8pm</p><p role="columnheader">9pm</p>
                    <p role="columnheader">10pm</p><p role="columnheader">11pm</p>
                </div>

                <!-- <div class="member-row" role="row">
                    <p class="member-name" role="cell"></p>
                    <p class="member-loc" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p> <p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                </div> -->
            </section>
        </div>

        <section class="time-slider">
            <label for="time">Adjust Time (UTC):</label>
            <input type="range" id="time">
        </section>
    </main>

    <dialog id="member-modal">
        <form method="dialog" id="member-form">
            <h2>Add Team Member</h2>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="timezone">Timezone Offset (UTC):</label>
                <input type="number" id="timezone" min="-12" max="14" step="0.5" value="0" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start-time">Work Start (0-23):</label>
                    <input type="number" id="start-time" min="0" max="23" value="9" required>
                </div>
                <div class="form-group">
                    <label for="end-time">Work End (0-23):</label>
                    <input type="number" id="end-time" min="0" max="23" value="17" required>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-secondary" type="button" id="cancel-btn">Cancel</button>
                <button class="btn" type="submit">Add Member</button>
            </div>
        </form>
    </dialog>
</body>
</html>
