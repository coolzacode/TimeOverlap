<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeOverlap</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="h1">TimeOverlap</h1>
        <button id="add-member-btn" class="btn header-btn" aria-label="Add Team Member">+</button>
    </header>

    <main class="main">
        <div class="grid-wrapper">
            <section id="grid" class="grid" role="table" aria-label="Team Schedule">
                <div class="header-row grid-header" role="row">
                    <p role="columnheader">Name</p>
                    <p role="columnheader">Location</p>
                    <p role="columnheader">12am</p><p role="columnheader">1am</p>
                    <p role="columnheader">2am</p><p role="columnheader">3am</p>
                    <p role="columnheader">4am</p><p role="columnheader">5am</p>
                    <p role="columnheader">6am</p><p role="columnheader">7am</p>
                    <p role="columnheader">8am</p><p role="columnheader">9am</p>
                    <p role="columnheader">10am</p> <p role="columnheader">11am</p>
                    <p role="columnheader">12pm</p><p role="columnheader">1pm</p>
                    <p role="columnheader">2pm</p><p role="columnheader">3pm</p>
                    <p role="columnheader">4pm</p><p role="columnheader">5pm</p>
                    <p role="columnheader">6pm</p><p role="columnheader">7pm</p>
                    <p role="columnheader">8pm</p><p role="columnheader">9pm</p>
                    <p role="columnheader">10pm</p><p role="columnheader">11pm</p>
                </div>

                <!-- <div class="member-row" role="row">
                    <p class="member-name" role="cell"></p>
                    <p class="member-loc" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p> <p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                    <p class="timeline-slot" role="cell"></p><p class="timeline-slot" role="cell"></p>
                </div> -->
            </section>
        </div>

        <section class="time-slider">
            <label for="time">Adjust Time (UTC):</label>
            <input type="range" id="time">
        </section>
    </main>

    <dialog id="member-modal">
        <form method="dialog" id="member-form">
            <h2>Add Team Member</h2>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input name="name" type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input name="location" type="text" id="location" required>
            </div>

            <div class="form-group">
                <label for="timezone">Member's Local Timezone</label>
                <select name="timezone" id="timezone-select" required>
                    <option value="" disabled selected>Select a timezone...</option>
        
                    <option value="America/New_York">Eastern Time (ET)</option>
                    <option value="America/Chicago">Central Time (CT)</option>
                    <option value="America/Denver">Mountain Time (MT)</option>
                    <option value="America/Los_Angeles">Pacific Time (PT)</option>
                    <option value="America/Anchorage">Alaska Time (AKT)</option>
                    <option value="Pacific/Honolulu">Hawaii-Aleutian Time (HAT)</option>

                    <option value="UTC">Universal Coordinated Time (UTC)</option>
                    <option value="Europe/London">Greenwich Mean Time (GMT / BST)</option>
                    <option value="Europe/Paris">Central European Time (CET / CEST)</option>
                    <option value="Europe/Istanbul">Eastern European Time (EET / TRT)</option>
                    <option value="Africa/Johannesburg">South Africa Standard Time (SAST)</option>

                    <option value="Asia/Dubai">Gulf Standard Time (GST)</option>
                    <option value="Asia/Kolkata">India Standard Time (IST)</option>
                    <option value="Asia/Bangkok">Indochina Time (ICT)</option>
                    <option value="Asia/Shanghai">China Standard Time (CST)</option>
                    <option value="Asia/Tokyo">Japan Standard Time (JST)</option>
                    <option value="Australia/Sydney">Australian Eastern Time (AET)</option>
                    <option value="Pacific/Auckland">New Zealand Time (NZT)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start-time">Work Start</label>
                    <select name="start-time" id="start-time" required>
                        <option value="" disabled selected>Select an hour</option>
                        <option value="12am">12am</option>
                        <option value="1am">1am</option>
                        <option value="2am">2am</option>
                        <option value="3am">3am</option>
                        <option value="4am">4am</option>
                        <option value="5am">5am</option>
                        <option value="6am">6am</option>
                        <option value="7am">7am</option>
                        <option value="8am">8am</option>
                        <option value="9am">9am</option>
                        <option value="10am">10am</option>
                        <option value="11am">11am</option>
                        <option value="12pm">12pm</option>
                        <option value="1pm">1pm</option>
                        <option value="2pm">2pm</option>
                        <option value="3pm">3pm</option>
                        <option value="4pm">4pm</option>
                        <option value="5pm">5pm</option>
                        <option value="6pm">6pm</option>
                        <option value="7pm">7pm</option>
                        <option value="8pm">8pm</option>
                        <option value="9pm">9pm</option>
                        <option value="10pm">10pm</option>
                        <option value="11pm">11pm</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="end-time">Work End</label>
                    <select name="end-time" id="end-time" required>
                        <option value="" disabled selected>Select an hour</option>
                        <option value="12am">12am</option>
                        <option value="1am">1am</option>
                        <option value="2am">2am</option>
                        <option value="3am">3am</option>
                        <option value="4am">4am</option>
                        <option value="5am">5am</option>
                        <option value="6am">6am</option>
                        <option value="7am">7am</option>
                        <option value="8am">8am</option>
                        <option value="9am">9am</option>
                        <option value="10am">10am</option>
                        <option value="11am">11am</option>
                        <option value="12pm">12pm</option>
                        <option value="1pm">1pm</option>
                        <option value="2pm">2pm</option>
                        <option value="3pm">3pm</option>
                        <option value="4pm">4pm</option>
                        <option value="5pm">5pm</option>
                        <option value="6pm">6pm</option>
                        <option value="7pm">7pm</option>
                        <option value="8pm">8pm</option>
                        <option value="9pm">9pm</option>
                        <option value="10pm">10pm</option>
                        <option value="11pm">11pm</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-secondary" type="button" id="cancel-btn">Cancel</button>
                <button class="btn" type="submit">Add Member</button>
            </div>
        </form>
    </dialog>
</body>
</html>
